<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Yakuza Samusar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 min-h-screen">
  <nav id="nav" class="bg-white shadow-sm"></nav>
  <div class="min-h-[calc(100vh-56px)] flex items-center justify-center">
  <div class="bg-white shadow-md rounded-xl p-8 w-full max-w-sm">
    <h1 class="text-2xl font-bold text-orange-600 mb-6 text-center">Welcome back</h1>

    <p id="error" class="hidden bg-red-100 text-red-700 text-sm rounded-md p-2 mb-4"></p>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="email" required class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="password" required class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-orange-500" />
      </div>
      <button type="submit" class="w-full bg-orange-600 text-white rounded-md py-2 font-medium hover:bg-orange-700 transition">Login</button>
    </form>

    <p class="text-sm text-gray-600 text-center mt-4">
      Don't have an account? <a href="register.html" class="text-orange-600 font-medium">Register</a>
    </p>
    <p class="text-center mt-2">
      <a href="menu.html" class="text-sm text-gray-500 hover:text-orange-600">&larr; Back to menu</a>
    </p>
  </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>renderNav("login");</script>
</body>
</html>
