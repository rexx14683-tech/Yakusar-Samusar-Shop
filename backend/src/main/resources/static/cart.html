<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cart - Yakuza Samusar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 min-h-screen">
  <nav id="nav" class="bg-white shadow-sm"></nav>

  <div class="max-w-3xl mx-auto px-4 py-6">
    <h1 class="text-3xl font-bold text-gray-800 mb-4">Your Cart</h1>

    <p id="error" class="hidden bg-red-100 text-red-700 text-sm rounded-md p-2 mb-4"></p>
    <p id="empty" class="hidden text-gray-500 text-center mt-10">Your cart is empty. <a href="menu.html" class="text-orange-600 font-medium">Browse the menu</a>.</p>

    <div id="cart-items" class="space-y-3"></div>

    <div id="cart-summary" class="hidden bg-white rounded-lg shadow-sm p-4 mt-6 flex items-center justify-between">
      <span class="text-lg font-semibold text-gray-800">Total: <span id="cart-total" class="text-orange-600"></span></span>
      <button id="checkout-btn" class="bg-orange-600 text-white px-6 py-2 rounded-md font-medium hover:bg-orange-700 transition">Checkout</button>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/cart.js"></script>
</body>
</html>
