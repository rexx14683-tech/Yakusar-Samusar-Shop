<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin - Yakuza Samusar</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-orange-50 min-h-screen">
  <nav id="nav" class="bg-white shadow-sm"></nav>

  <div class="max-w-5xl mx-auto px-4 py-6">
    <h1 class="text-3xl font-bold text-gray-800 mb-4">Admin Panel</h1>

    <div class="flex gap-2 mb-6 border-b border-gray-200">
      <button data-tab="categories" class="tab-btn px-4 py-2 font-medium border-b-2 border-orange-600 text-orange-600">Categories</button>
      <button data-tab="food-items" class="tab-btn px-4 py-2 font-medium border-b-2 border-transparent text-gray-500 hover:text-orange-600">Food Items</button>
      <button data-tab="orders" class="tab-btn px-4 py-2 font-medium border-b-2 border-transparent text-gray-500 hover:text-orange-600">Orders</button>
      <button data-tab="users" class="tab-btn px-4 py-2 font-medium border-b-2 border-transparent text-gray-500 hover:text-orange-600">Users</button>
    </div>

    <p id="error" class="hidden bg-red-100 text-red-700 text-sm rounded-md p-2 mb-4"></p>

    <!-- Categories tab -->
    <section id="tab-categories" class="tab-section">
      <form id="category-form" class="bg-white rounded-lg shadow-sm p-4 flex gap-3 mb-4">
        <input id="category-name" type="text" placeholder="Category name" required class="flex-1 border border-gray-300 rounded-md px-3 py-2" />
        <button type="submit" class="bg-orange-600 text-white px-4 py-2 rounded-md hover:bg-orange-700 transition">Add category</button>
      </form>
      <div id="category-list" class="bg-white rounded-lg shadow-sm divide-y"></div>
    </section>

    <!-- Food items tab -->
    <section id="tab-food-items" class="tab-section hidden">
      <form id="food-item-form" class="bg-white rounded-lg shadow-sm p-4 grid grid-cols-1 sm:grid-cols-2 gap-3 mb-4" enctype="multipart/form-data">
        <input type="hidden" id="food-item-id" />
        <input id="food-item-name" type="text" placeholder="Name" required class="border border-gray-300 rounded-md px-3 py-2" />
        <select id="food-item-category" class="border border-gray-300 rounded-md px-3 py-2">
          <option value="">No category</option>
        </select>
        <input id="food-item-price" type="number" min="0" step="0.01" placeholder="Price" required class="border border-gray-300 rounded-md px-3 py-2" />
        <input id="food-item-stock" type="number" min="0" placeholder="Stock quantity" required class="border border-gray-300 rounded-md px-3 py-2" />
        <textarea id="food-item-description" placeholder="Description" class="sm:col-span-2 border border-gray-300 rounded-md px-3 py-2"></textarea>
        <label class="flex items-center gap-2 text-sm text-gray-700">
          <input id="food-item-available" type="checkbox" checked class="h-4 w-4" /> Available
        </label>
        <input id="food-item-image" type="file" accept="image/png, image/jpeg" class="border border-gray-300 rounded-md px-3 py-2" />
        <div class="sm:col-span-2 flex gap-2">
          <button type="submit" class="bg-orange-600 text-white px-4 py-2 rounded-md hover:bg-orange-700 transition">Save item</button>
          <button type="button" id="food-item-reset" class="bg-gray-200 text-gray-700 px-4 py-2 rounded-md hover:bg-gray-300 transition">Clear</button>
        </div>
      </form>
      <div id="food-item-list" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
    </section>

    <!-- Orders tab -->
    <section id="tab-orders" class="tab-section hidden">
      <div id="order-list" class="space-y-3"></div>
    </section>

    <!-- Users tab -->
    <section id="tab-users" class="tab-section hidden">
      <div id="user-list" class="bg-white rounded-lg shadow-sm divide-y"></div>
    </section>
  </div>

  <script src="js/api.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
