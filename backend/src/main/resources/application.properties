spring.application.name=food-store-backend
server.port=8090

# ---- MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/food_store?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA ----
# schema.sql / seed data are applied manually (see db/schema.sql), so JPA never touches DDL
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---- File upload ----
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads

# ---- JWT ----
app.jwt.secret=change-this-super-secret-key-to-something-long-and-random-in-production
app.jwt.expiration-ms=86400000
